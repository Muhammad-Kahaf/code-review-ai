<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect width="510" height="510" x="1" y="1" rx="127" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  <!-- Outer Glow Ring -->
  <rect width="460" height="460" x="26" y="26" rx="104" stroke="url(#emerald-glow)" stroke-width="3" opacity="0.25" />

  <!-- Code Bracket Left < -->
  <path d="M 195 160 L 115 256 L 195 352" 
        stroke="url(#cyan-glow)" 
        stroke-width="38" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#soft-glow)" />

  <!-- Code Bracket Right > -->
  <path d="M 317 160 L 397 256 L 317 352" 
        stroke="url(#cyan-glow)" 
        stroke-width="38" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#soft-glow)" />

  <!-- Central AI Neural Diamond / Shield Core -->
  <g filter="url(#glow-filter)">
    <path d="M 256 128 L 298 175 L 298 275 C 298 325 256 365 256 365 C 256 365 214 325 214 275 L 214 175 Z" 
          fill="url(#emerald-glow)" 
          opacity="0.9" />
  </g>

  <!-- Inner High-Tech AI Sparkle / Check -->
  <path d="M 235 248 L 250 265 L 278 230" 
        stroke="#FFFFFF" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Central AI Node Core -->
  <circle cx="256" cy="180" r="14" fill="#FFFFFF" opacity="0.95" />
  
  <!-- Circuit Traces -->
  <line x1="256" y1="194" x2="256" y2="218" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <circle cx="256" cy="308" r="7" fill="#A7F3D0" />
</svg>
